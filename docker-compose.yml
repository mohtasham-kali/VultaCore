version: '3.9'

services:
  # ── Backend API (NestJS) ──────────────────────────────
  api:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
    container_name: vultacore-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-/data/saas.sqlite}
    volumes:
      - api-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── AI Services (FastAPI / Python) ───────────────────
  ai:
    build:
      context: ./ai-services
      dockerfile: Dockerfile
    container_name: vultacore-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Web Dashboard (Next.js) ─── uncomment for full stack ──
  # web:
  #   build:
  #     context: ./web-dashboard
  #     dockerfile: Dockerfile
  #   container_name: vultacore-web
  #   restart: unless-stopped
  #   ports:
  #     - "3000:3000"
  #   env_file:
  #     - ./web-dashboard/.env.local
  #   depends_on:
  #     - api

volumes:
  api-data:
