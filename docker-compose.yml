services:
  # ── Backend API (NestJS) ──────────────────────────────
  api:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
    container_name: vultacore-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      DATABASE_URL: sqlite:///data/saas.sqlite  # Ensure correct SQLite URL format
      AI_SERVICE_URL: http://ai:29041
    volumes:
      - api-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── AI Services (FastAPI / Python) ───────────────────
  ai:
    build:
      context: ./ai-services
      dockerfile: Dockerfile
    container_name: vultacore-ai
    restart: unless-stopped
    ports:
      - "29041:8000"  # Map host port 29041 to container port 8000
    environment:
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]  # Check health on internal port
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  api-data:
