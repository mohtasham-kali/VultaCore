name: Security Pipeline (SAST, SCA, Secrets)

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1' # Weekly full scan, Mondays at 03:23 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Gitleaks (Secrets Detection)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Scanner
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --config /repo/.gitleaks.toml --redact --exit-code 1

  sast-semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install & Run Semgrep
        run: |
          pip install semgrep
          semgrep scan \
            --config p/default \
            --config p/typescript \
            --config p/python \
            --config .semgrep/rules.yml \
            --metrics=off \
            --error \
            --exclude node_modules \
            --exclude out \
            --exclude dist \
            --exclude .next

  trivy:
    name: Trivy (SCA & Misconfigurations)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy File System Scan
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:latest fs \
            --config /src/.trivy.yaml \
            /src

  codeql:
    name: CodeQL Deep Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
