name: Cron Jobs

on:
  schedule:
    # Keep Render API alive — runs every 14 minutes (Render sleeps after 15min)
    - cron: '*/14 * * * *'
    # Daily health report — runs every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger from Actions tab

jobs:
  keep-alive:
    name: Ping API (Prevent Sleep)
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend API
        run: |
          URL="${{ secrets.NEXT_PUBLIC_API_URL }}"
          if [ -z "$URL" ]; then
            echo "::warning::NEXT_PUBLIC_API_URL secret is not set, skipping ping..."
          else
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/" || echo "curl_failed")
            echo "API responded with HTTP $STATUS"
            if [ "$STATUS" != "200" ]; then
              echo "::warning::API returned $STATUS — may be starting up"
            fi
          fi

      - name: Ping AI Service
        run: |
          URL="${{ secrets.AI_SERVICE_URL }}"
          if [ -z "$URL" ]; then
            echo "::warning::AI_SERVICE_URL secret is not set, skipping ping..."
          else
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health" || echo "000")
            echo "AI Service responded with HTTP $STATUS"
          fi

  daily-maintenance:
    name: Daily Maintenance Tasks
    runs-on: ubuntu-latest
    # Only run on the midnight schedule
    if: github.event_name == 'schedule'
    steps:
      - name: Trigger Analytics Aggregation
        run: |
          URL="${{ secrets.NEXT_PUBLIC_API_URL }}"
          if [ -z "$URL" ]; then
            echo "::warning::NEXT_PUBLIC_API_URL secret is not set, skipping aggregation..."
          else
            curl -s -X POST "$URL/analytics/aggregate" \
              -H "Content-Type: application/json" \
              -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
              || echo "Aggregation endpoint failed or not yet implemented"
          fi

      - name: Clean Old Notifications (>30 days)
        run: |
          URL="${{ secrets.NEXT_PUBLIC_API_URL }}"
          if [ -z "$URL" ]; then
            echo "::warning::NEXT_PUBLIC_API_URL secret is not set, skipping cleanup..."
          else
            curl -s -X DELETE "$URL/notifications/cleanup" \
              -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
              || echo "Cleanup endpoint failed or not yet implemented"
          fi

      - name: Report Summary
        run: |
          echo "==============================="
          echo "Daily Maintenance Complete"
          echo "Timestamp: $(date -u)"
          echo "==============================="
