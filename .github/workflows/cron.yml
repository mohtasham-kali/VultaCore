name: Cron Jobs

on:
  schedule:
    # Keep-alive for Render free tier (sleeps after 15 min idle).
    # GitHub cron is best-effort and can be delayed; an external pinger
    # (UptimeRobot / cron-job.org, both free) is more reliable.
    - cron: '*/14 * * * *'
    # Daily maintenance, offset from :00 to avoid GitHub's top-of-hour congestion.
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: cron-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  keep-alive:
    name: Ping API (prevent sleep)
    # FIX: the original ran the daily job on BOTH schedules (every 14 min).
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/14 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      AI_URL: ${{ secrets.AI_SERVICE_URL }}
    steps:
      - name: Ping services
        run: |
          ping_url() {
            name="$1"; url="$2"
            if [ -z "$url" ]; then echo "::warning::$name URL not set, skipping"; return 0; fi
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 --retry 2 "$url" || true)
            echo "$name -> HTTP $code"
            case "$code" in 2*|3*) ;; *) echo "::warning::$name returned $code (may be waking up)";; esac
          }
          ping_url "API" "${API_URL%/}/"
          ping_url "AI service" "${AI_URL%/}/health"

  daily-maintenance:
    name: Daily maintenance
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 0 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Require config
        run: |
          [ -n "$API_URL" ] || { echo "::error::NEXT_PUBLIC_API_URL secret is not set"; exit 1; }
          [ -n "$CRON_SECRET" ] || { echo "::error::CRON_SECRET secret is not set"; exit 1; }

      # -f makes curl fail on HTTP 4xx/5xx, so a broken endpoint turns the run red
      # instead of being swallowed by `|| echo`.
      - name: Trigger analytics aggregation
        run: |
          curl -fsS --max-time 120 -X POST "${API_URL%/}/analytics/aggregate" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: $CRON_SECRET"

      - name: Clean old notifications (>30 days)
        run: |
          curl -fsS --max-time 120 -X DELETE "${API_URL%/}/notifications/cleanup" \
            -H "x-cron-secret: $CRON_SECRET"

      - name: Summary
        run: echo "Daily maintenance complete at $(date -u)" >> "$GITHUB_STEP_SUMMARY"