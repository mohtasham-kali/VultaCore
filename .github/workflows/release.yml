name: Release Multi-Platform App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS Universal Darwin Targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install web-dashboard dependencies
        run: npm install
        working-directory: web-dashboard

      - name: Build web-dashboard (Next.js static export for Tauri)
        run: |
          rm -rf .next/ out/
          STATIC_EXPORT=true npm run build
        working-directory: web-dashboard

      - name: Install desktop-app dependencies
        run: npm install
        working-directory: desktop-app

      - name: Build and Publish Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop-app
          tagName: v__VERSION__
          releaseName: 'VultaCore v__VERSION__'
          releaseBody: |
            ## VultaCore v__VERSION__ Desktop Release

            Download the installer for your platform:

            | Platform | File |
            |---|---|
            | **Windows** | `VultaCore_x.x.x_x64-setup.exe` |
            | **macOS (Universal)** | `VultaCore_x.x.x_universal.dmg` |
            | **Linux (.deb)** | `VultaCore_x.x.x_amd64.deb` |
            | **Linux (AppImage)** | `VultaCore_x.x.x_amd64.AppImage` |

            ### Terminal Install (Linux)
            ```bash
            # Debian / Ubuntu
            curl -fsSL https://vultacore.techprogression.com/downloads/VultaCore_0.1.0_amd64.deb -o VultaCore.deb
            sudo apt install ./VultaCore.deb && rm VultaCore.deb

            # Fedora / RHEL
            curl -fsSL https://vultacore.techprogression.com/downloads/VultaCore-0.1.0-1.x86_64.rpm -o VultaCore.rpm
            sudo dnf install ./VultaCore.rpm && rm VultaCore.rpm
            ```
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
