name: Release Multi-Platform App

on:
  push:
    branches: [ main ]

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-2025'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            web-dashboard/package-lock.json
            desktop-app/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Add the universal Apple Darwin targets for macOS universal binary
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install web-dashboard dependencies (Tauri frontend)
        run: npm install
        working-directory: web-dashboard

      - name: Build web-dashboard (Next.js static export for Tauri)
        run: npm run build
        working-directory: web-dashboard

      - name: Install desktop-app dependencies
        run: npm install
        working-directory: desktop-app

      - name: Build and Publish Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop-app
          tagName: vultacore-v__VERSION__
          releaseName: 'VultaCore v__VERSION__'
          releaseBody: |
            VultaCore Desktop Release
            
            Download your platform installer below:
            - **Windows**: `.exe` (NSIS installer) or `.msi`
            - **macOS**: `.dmg` (Universal — runs on both Intel & Apple Silicon)
            - **Linux**: `.deb` (Debian/Ubuntu) or `.AppImage` (portable)
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
