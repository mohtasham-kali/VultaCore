name: Build & Upload Installers to Hostinger

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-frontend:
    name: Build Frontend (Static Export)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web-dashboard dependencies
        run: npm install
        working-directory: web-dashboard

      - name: Build web-dashboard (static export for Tauri)
        working-directory: web-dashboard
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: https://vultacore.techprogression.com/api
          NEXT_PUBLIC_LS_VARIANT_STANDARD: ${{ vars.NEXT_PUBLIC_LS_VARIANT_STANDARD }}
          NEXT_PUBLIC_LS_VARIANT_PREMIUM: ${{ vars.NEXT_PUBLIC_LS_VARIANT_PREMIUM }}
          NEXT_PUBLIC_LS_VARIANT_ENTERPISE: ${{ vars.NEXT_PUBLIC_LS_VARIANT_ENTERPISE }}
          NEXT_PUBLIC_LS_STORE_ID: ${{ vars.NEXT_PUBLIC_LS_STORE_ID }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
        run: |
          rm -rf .next/ out/
          STATIC_EXPORT=true npm run build

      - name: Upload frontend static export
        uses: actions/upload-artifact@v4
        with:
          name: tauri-frontend-dist
          path: web-dashboard/out/
          retention-days: 1

  build-linux:
    name: Build Linux Installers
    needs: [build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Download frontend static export
        uses: actions/download-artifact@v4
        with:
          name: tauri-frontend-dist
          path: web-dashboard/out

      - name: Install desktop-app dependencies
        run: |
          rm -f ../package-lock.json package-lock.json
          npm install --no-package-lock
        working-directory: desktop-app

      - name: Build Tauri app executable & installers
        run: npx tauri build --bundles deb,appimage --no-sign
        working-directory: desktop-app

      - name: Collect built Linux installers
        run: |
          mkdir -p dist-installers
          find desktop-app/src-tauri/target -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.rpm" \) 2>/dev/null | xargs -I{} cp {} dist-installers/ || true
          ls -lh dist-installers/

      - name: Upload installers as artifact
        uses: actions/upload-artifact@v4
        with:
          name: installers-linux
          path: dist-installers/
          retention-days: 7

  build-windows:
    name: Build Windows Installers
    needs: [build-frontend]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Download frontend static export
        uses: actions/download-artifact@v4
        with:
          name: tauri-frontend-dist
          path: web-dashboard/out

      - name: Install desktop-app dependencies
        run: |
          rm -f ../package-lock.json package-lock.json
          npm install --no-package-lock
          npm install --no-package-lock @tauri-apps/cli-win32-x64-msvc@^2.10.1
        working-directory: desktop-app

      - name: Build Tauri app executable & installers (Windows)
        run: npx tauri build --bundles nsis --no-sign
        working-directory: desktop-app

      - name: Collect built Windows installers
        run: |
          mkdir -p dist-installers
          find desktop-app/src-tauri/target -type f -name "*setup*.exe" -o -name "*.msi" 2>/dev/null | xargs -I{} cp {} dist-installers/ || true
          find desktop-app/src-tauri/target/release/bundle -type f \( -name "*.msi" -o -name "*.exe" \) 2>/dev/null | xargs -I{} cp {} dist-installers/ || true
          ls -lh dist-installers/

      - name: Upload installers as artifact
        uses: actions/upload-artifact@v4
        with:
          name: installers-windows
          path: dist-installers/
          retention-days: 7

  build-macos:
    name: Build macOS Installers
    needs: [build-frontend]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Download frontend static export
        uses: actions/download-artifact@v4
        with:
          name: tauri-frontend-dist
          path: web-dashboard/out

      - name: Install desktop-app dependencies
        run: |
          rm -f ../package-lock.json package-lock.json
          npm install --no-package-lock
          npm install --no-package-lock @tauri-apps/cli-darwin-arm64@^2.10.1
        working-directory: desktop-app

      - name: Build Tauri app executable & installers (macOS)
        run: npx tauri build --bundles dmg --no-sign
        working-directory: desktop-app

      - name: Collect built macOS installers
        run: |
          mkdir -p dist-installers
          find desktop-app/src-tauri/target/release/bundle -type f \( -name "*.dmg" -o -name "*.pkg" \) 2>/dev/null | xargs -I{} cp {} dist-installers/ || true
          ls -lh dist-installers/

      - name: Upload installers as artifact
        uses: actions/upload-artifact@v4
        with:
          name: installers-macos
          path: dist-installers/
          retention-days: 7

  deploy-to-hostinger:
    name: Upload Installers to Hostinger
    needs: [build-linux, build-windows, build-macos]
    if: always() && (needs.build-linux.result == 'success' || needs.build-windows.result == 'success' || needs.build-macos.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-installers
          pattern: installers-*
          merge-multiple: true

      - name: List collected installers
        run: ls -lh all-installers/

      - name: Upload installers to Hostinger via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASS }}
          source: "all-installers/*"
          target: "~/domains/vultacore.techprogression.com/nodejs/public/downloads/"
          strip_components: 1

      - name: Verify upload on Hostinger
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASS }}
          script: |
            echo "=== Installers in public/downloads/ ==="
            ls -lh ~/domains/vultacore.techprogression.com/nodejs/public/downloads/ 2>/dev/null || echo "Directory empty or missing"
