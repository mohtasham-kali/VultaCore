name: Build & Upload Installers to Hostinger

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-frontend:
    name: Build Frontend (Static Export)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web-dashboard dependencies
        run: npm install
        working-directory: web-dashboard

      - name: Build web-dashboard (static export for Tauri)
        working-directory: web-dashboard
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: https://vultacore.techprogression.com/api
          NEXT_PUBLIC_LS_VARIANT_STANDARD: ${{ vars.NEXT_PUBLIC_LS_VARIANT_STANDARD }}
          NEXT_PUBLIC_LS_VARIANT_PREMIUM: ${{ vars.NEXT_PUBLIC_LS_VARIANT_PREMIUM }}
          NEXT_PUBLIC_LS_VARIANT_ENTERPISE: ${{ vars.NEXT_PUBLIC_LS_VARIANT_ENTERPISE }}
          NEXT_PUBLIC_LS_STORE_ID: ${{ vars.NEXT_PUBLIC_LS_STORE_ID }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
        run: |
          rm -rf .next/ out/
          rm -rf src/app/api
          STATIC_EXPORT=true npm run build

      - name: Upload frontend static export
        uses: actions/upload-artifact@v4
        with:
          name: tauri-frontend-dist
          path: web-dashboard/out/
          retention-days: 1

  build-linux:
    name: Build Linux Installers
    needs: [build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Download frontend static export
        uses: actions/download-artifact@v4
        with:
          name: tauri-frontend-dist
          path: web-dashboard/out

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2

      - name: Build Tauri app executable & installers
        run: tauri build --bundles deb,appimage --no-sign
        working-directory: desktop-app

      - name: Collect built Linux installers
        run: |
          mkdir -p dist-installers
          find desktop-app/src-tauri/target -type f \
            \( -name "*.deb" -o -name "*.AppImage" -o -name "*.rpm" \) \
            -exec cp {} dist-installers/ \;
          ls -lh dist-installers/

      - name: Upload installers as artifact
        uses: actions/upload-artifact@v4
        with:
          name: installers-linux
          path: dist-installers/
          retention-days: 7

  build-windows:
    name: Build Windows Installers
    needs: [build-frontend]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Download frontend static export
        uses: actions/download-artifact@v4
        with:
          name: tauri-frontend-dist
          path: web-dashboard/out

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2

      - name: Build Tauri app executable & installers (Windows)
        run: tauri build --bundles nsis --no-sign
        working-directory: desktop-app

      - name: Collect built Windows installers
        run: |
          mkdir -p dist-installers

          find desktop-app/src-tauri/target -type f \
            \( -iname "*setup*.exe" -o -iname "*.msi" \) \
            -exec cp {} dist-installers/ \;

          find desktop-app/src-tauri/target/release/bundle -type f \
            \( -iname "*.msi" -o -iname "*.exe" \) \
            -exec cp -n {} dist-installers/ \; 2>/dev/null || true

          ls -lh dist-installers/

      - name: Upload installers as artifact
        uses: actions/upload-artifact@v4
        with:
          name: installers-windows
          path: dist-installers/
          retention-days: 7

  build-macos:
    name: Build macOS Installers
    needs: [build-frontend]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Download frontend static export
        uses: actions/download-artifact@v4
        with:
          name: tauri-frontend-dist
          path: web-dashboard/out

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2

      - name: Build Tauri app executable & installers (macOS)
        run: tauri build --bundles dmg --no-sign
        working-directory: desktop-app

      - name: Collect built macOS installers
        run: |
          mkdir -p dist-installers

          find desktop-app/src-tauri/target/release/bundle -type f \
            \( -name "*.dmg" -o -name "*.pkg" \) \
            -exec cp {} dist-installers/ \; 2>/dev/null || true

          ls -lh dist-installers/

      - name: Upload installers as artifact
        uses: actions/upload-artifact@v4
        with:
          name: installers-macos
          path: dist-installers/
          retention-days: 7

  deploy-to-hostinger:
    name: Upload Installers to Hostinger
    needs: [build-linux, build-windows, build-macos]
    if: >-
      ${{
        !cancelled() &&
        (
          needs.build-linux.result == 'success' ||
          needs.build-windows.result == 'success' ||
          needs.build-macos.result == 'success'
        )
      }}
    runs-on: ubuntu-latest

    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-installers
          pattern: installers-*
          merge-multiple: true

      - name: List and validate collected installers
        run: |
          echo "=== Collected installers ==="
          find all-installers -maxdepth 1 -type f -printf '%f (%s bytes)\n'

          if ! find all-installers -maxdepth 1 -type f -print -quit | grep -q .; then
            echo "::error::No installer files were downloaded."
            exit 1
          fi
      - name: Check secret is present
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: '45.130.228.127'
          username: 'u879979656'
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 65002 
      # Validate the private key without exposing it in logs.
      # Supports encrypted keys when SSH_PASSPHRASE is configured.
      - name: Validate SSH private key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -eu

          if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
            echo "::error::SSH_PRIVATE_KEY is missing or empty."
            exit 1
          fi

          KEY_FILE="$RUNNER_TEMP/hostinger_deploy_key"
          trap 'rm -f "$KEY_FILE"' EXIT

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          if ssh-keygen -y -P "${SSH_PASSPHRASE:-}" -f "$KEY_FILE" > /dev/null; then
            echo "SSH private key format and passphrase validated."
          else
            echo "::error::SSH key validation failed."
            exit 1
          fi

      - name: Ensure target directory exists on Hostinger
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: '45.130.228.127'
          username: 'u879979656'
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 65002
          timeout: 30s
          command_timeout: 2m
          script: |
            set -eu
            mkdir -p ~/domains/vultacore.techprogression.com/nodejs/public/downloads/
            echo "Target downloads directory is ready."

      - name: Upload installers to Hostinger via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: '45.130.228.127'
          username: 'u879979656'
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 65002
          timeout: 30s
          command_timeout: 10m
          source: "all-installers/*"
          target: "/home/u879979656/domains/vultacore.techprogression.com/nodejs/public/downloads/"
          strip_components: 1
          overwrite: true

      - name: Verify upload on Hostinger
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: '45.130.228.127'
          username: 'u879979656'
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 65002
          timeout: 30s
          command_timeout: 2m
          script: |
            set -eu
            DOWNLOAD_DIR="$HOME/domains/vultacore.techprogression.com/nodejs/public/downloads"

            echo "=== Installers in public/downloads/ ==="
            ls -lh "$DOWNLOAD_DIR"

            if ! find "$DOWNLOAD_DIR" -maxdepth 1 -type f -print -quit | grep -q .; then
              echo "ERROR: No installer files found."
              exit 1
            fi

            echo "Installer upload verified."