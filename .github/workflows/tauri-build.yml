name: "Tauri App Build"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - 'v*' # Trigger this workflow when pushing a version tag (e.g., v1.0.0)
  workflow_dispatch: # Allow manually triggering from the Actions tab

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # For MacOS dmg
            args: "--target universal-apple-darwin"
          - platform: "ubuntu-22.04" # For Linux AppImage & deb
            args: ""
          - platform: "windows-latest" # For Windows exe & msi
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "desktop-app/package-lock.json"

      - name: Install System Dependencies (Linux only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
        
      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Frontend Dependencies
        run: npm install
        working-directory: desktop-app

      - name: Build and Release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "desktop-app"
          args: ${{ matrix.args }}
          tagName: "v2.1.0" # Automatically draft a release with this name
          releaseName: "VultaCore v2.1.0"
          releaseBody: |
            Release of VultaCore Desktop.
            Contains automated builds for Windows, macOS, and Linux.
          releaseDraft: true
          prerelease: false
