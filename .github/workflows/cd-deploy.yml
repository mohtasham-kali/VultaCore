name: CD — Deploy on Merge to Main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never cancel a deploy halfway

jobs:
  ci-web:
    # Deploy only code that passed frontend CI
    uses: ./.github/workflows/ci-web.yml
    secrets: inherit

  ci-api:
    # Deploy only code that passed backend API CI
    uses: ./.github/workflows/ci-api.yml
    secrets: inherit

  deploy-hostinger:
    name: Deploy to Hostinger
    needs: [ci-web, ci-api]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_DIR: ~/domains/vultacore.techprogression.com/hbuilds/last-source
      CURRENT_DIR: ~/domains/vultacore.techprogression.com/hbuilds/current/nodejs
      NODE: /opt/alt/alt-nodejs24/root/bin/node
      NPM: /opt/alt/alt-nodejs24/root/bin/npm
    steps:
      - name: Deploy over SSH
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST || secrets.HOSTINGER_SSH_HOST }}
          port: ${{ secrets.DEPLOY_PORT || secrets.HOSTINGER_SSH_PORT || 65002 }}
          username: ${{ secrets.DEPLOY_USER || secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          envs: SOURCE_DIR,CURRENT_DIR,NODE,NPM
          script_stop: true
          script: |
            set -euo pipefail

            SRC="${SOURCE_DIR/#\~/$HOME}"
            CUR="${CURRENT_DIR/#\~/$HOME}"

            [ -d "$SRC/.git" ] || { echo "ERROR: $SRC is not a git checkout"; exit 1; }
            [ -d "$CUR" ]      || { echo "ERROR: $CUR (hbuilds/current/nodejs) not found"; exit 1; }

            export PATH="$(dirname $NODE):$PATH"
            cd "$SRC"

            git config --global --add safe.directory "$SRC"

            # Save rollback point
            git rev-parse HEAD > ~/.vultacore_prev_sha

            # Backup sqlite if present
            if [ -f "$CUR/saas.sqlite" ]; then
              mkdir -p ~/backups
              cp "$CUR/saas.sqlite" ~/backups/saas.$(date +%Y%m%d-%H%M%S).sqlite 2>/dev/null || true
              cp "$CUR/saas.sqlite" /tmp/saas.keep
            fi

            echo "=== PULL latest code ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== INSTALL dependencies ==="
            $NPM ci --omit=dev --legacy-peer-deps \
              || $NPM ci --omit=dev \
              || $NPM install --omit=dev --legacy-peer-deps

            echo "=== BUILD backend ==="
            $NPM run build --workspace backend-api

            echo "=== BUILD frontend ==="
            $NPM run build --workspace web-dashboard

            echo "=== SYNC to current/nodejs ==="
            rsync -a --delete \
              --exclude='.git' \
              --exclude='node_modules/.cache' \
              --exclude='web-dashboard/.next/cache' \
              "$SRC/" "$CUR/"

            # Restore sqlite backup
            [ -f /tmp/saas.keep ] && cp /tmp/saas.keep "$CUR/saas.sqlite" && rm -f /tmp/saas.keep

            echo "=== PYTHON AI service (best-effort) ==="
            if [ -d "$CUR/ai-services" ]; then
              PY=""
              for c in /opt/alt/python311/bin/python3 /opt/alt/python310/bin/python3 python3; do
                command -v "$c" >/dev/null 2>&1 && PY="$c" && break
                [ -x "$c" ] && PY="$c" && break
              done
              if [ -n "$PY" ]; then
                AI="$CUR/ai-services"
                [ -x "$AI/venv/bin/python" ] || "$PY" -m venv "$AI/venv"
                "$AI/venv/bin/pip" install --quiet --upgrade pip || true
                "$AI/venv/bin/pip" install --quiet -r "$AI/requirements.txt" || true
              fi
            fi

            echo "=== RESTART Passenger ==="
            mkdir -p "$CUR/tmp"
            touch "$CUR/tmp/restart.txt"
            echo "Deployed $(git rev-parse --short HEAD) at $(date -u)"

      - name: Health check
        id: health
        run: |
          URL="${{ secrets.HEALTH_URL || vars.HEALTH_URL || 'https://vultacore.techprogression.com/health' }}"
          [ -n "$URL" ] || { echo "::error::HEALTH_URL not set"; exit 1; }
          for i in 1 2 3 4 5 6; do
            body=$(curl -fsS --max-time 20 "$URL" || true)
            if echo "$body" | jq -e '.status=="up" and .ready.backend and .ready.dashboard' >/dev/null 2>&1; then
              echo "Healthy and running: $body"
              exit 0
            fi
            echo "Attempt $i not healthy yet: $body"; sleep 10
          done
          echo "::error::Health check failed (down, not ready, or timeout)"; exit 1

      - name: Roll back on failure
        if: failure() && steps.deploy.outcome == 'success' && steps.health.outcome == 'failure'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST || secrets.HOSTINGER_SSH_HOST }}
          port: ${{ secrets.DEPLOY_PORT || secrets.HOSTINGER_SSH_PORT || 65002 }}
          username: ${{ secrets.DEPLOY_USER || secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          envs: SOURCE_DIR,CURRENT_DIR,NODE,NPM
          script: |
            set -e
            SRC="${SOURCE_DIR/#\~/$HOME}"
            CUR="${CURRENT_DIR/#\~/$HOME}"
            export PATH="$(dirname $NODE):$PATH"
            if [ -f ~/.vultacore_prev_sha ]; then
              cd "$SRC"
              git reset --hard "$(cat ~/.vultacore_prev_sha)"
              $NPM run build --workspace backend-api || true
              $NPM run build --workspace web-dashboard || true
              rsync -a --delete --exclude='.git' --exclude='node_modules/.cache' "$SRC/" "$CUR/"
              touch "$CUR/tmp/restart.txt"
              echo "Rolled back to $(git rev-parse --short HEAD)"
            fi
