name: CD — Deploy on Merge to Main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never cancel a deploy halfway

jobs:
  ci-web:
    # Deploy only code that passed frontend CI
    uses: ./.github/workflows/ci-web.yml
    secrets: inherit

  ci-api:
    # Deploy only code that passed backend API CI
    uses: ./.github/workflows/ci-api.yml
    secrets: inherit

  deploy-hostinger:
    name: Deploy to Hostinger
    needs: [ci-web, ci-api]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '~/domains/vultacore.techprogression.com/nodejs' }}
    steps:
      - name: Deploy over SSH
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST || secrets.HOSTINGER_SSH_HOST }}
          port: ${{ secrets.DEPLOY_PORT || secrets.HOSTINGER_SSH_PORT || 65002 }}
          username: ${{ secrets.DEPLOY_USER || secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_PATH
          script_stop: true
          script: |
            set -euo pipefail
            source ~/.bashrc 2>/dev/null || source ~/.bash_profile 2>/dev/null || true

            TARGET_DIR="${DEPLOY_PATH/#\~/$HOME}"
            [ -d "$TARGET_DIR/.git" ] || { echo "Directory $TARGET_DIR is not a git checkout"; exit 1; }
            cd "$TARGET_DIR"

            git config --global --add safe.directory "$TARGET_DIR"

            # Remember where we were so we can roll back.
            git rev-parse HEAD > ~/.vultacore_prev_sha

            # saas.sqlite is tracked in git, so backup and restore if exists
            if [ -f saas.sqlite ]; then
              mkdir -p ~/backups
              cp saas.sqlite ~/backups/saas.$(date +%Y%m%d-%H%M%S).sqlite 2>/dev/null || true
              cp saas.sqlite /tmp/saas.keep
            fi

            echo "=== FETCH ==="
            git fetch origin main
            git reset --hard origin/main
            [ -f /tmp/saas.keep ] && cp /tmp/saas.keep saas.sqlite && rm -f /tmp/saas.keep

            echo "=== NODE DEPS ==="
            npm ci --omit=dev --legacy-peer-deps || npm ci --omit=dev || npm install --omit=dev --legacy-peer-deps

            echo "=== BUILD BACKEND ==="
            cd backend-api && npm run build && cd "$TARGET_DIR"

            echo "=== PYTHON AI SERVICE ==="
            if [ -d ai-services ]; then
              cd ai-services
              PY=""
              for c in /opt/alt/python311/bin/python3 /opt/alt/python310/bin/python3 /opt/alt/python39/bin/python3 python3.11 python3.10 python3.9 python3; do
                if command -v "$c" >/dev/null 2>&1 || [ -x "$c" ]; then PY="$c"; break; fi
              done
              if [ -n "$PY" ]; then
                [ -x venv/bin/python ] || "$PY" -m venv venv
                ./venv/bin/pip install --quiet --upgrade pip || true
                ./venv/bin/pip install --quiet -r requirements.txt || true
              fi
              cd "$TARGET_DIR"
            fi

            echo "=== RESTART ==="
            if command -v passenger-config >/dev/null 2>&1; then
              passenger-config restart-app "$TARGET_DIR" || touch tmp/restart.txt
            else
              mkdir -p tmp && touch tmp/restart.txt
            fi
            echo "Deployed $(git rev-parse --short HEAD) at $(date -u)"

      - name: Health check
        id: health
        run: |
          URL="${{ secrets.HEALTH_URL || vars.HEALTH_URL || 'https://vultacore.techprogression.com/health' }}"
          [ -n "$URL" ] || { echo "::error::HEALTH_URL not set"; exit 1; }
          for i in 1 2 3 4 5 6; do
            body=$(curl -fsS --max-time 20 "$URL" || true)
            if echo "$body" | jq -e '.status=="up" and .ready.backend and .ready.dashboard' >/dev/null 2>&1; then
              echo "Healthy and running: $body"
              exit 0
            fi
            echo "Attempt $i not healthy yet: $body"; sleep 10
          done
          echo "::error::Health check failed (down, not ready, or timeout)"; exit 1

      - name: Roll back on failure
        if: failure() && steps.deploy.outcome == 'success' && steps.health.outcome == 'failure'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST || secrets.HOSTINGER_SSH_HOST }}
          port: ${{ secrets.DEPLOY_PORT || secrets.HOSTINGER_SSH_PORT || 65002 }}
          username: ${{ secrets.DEPLOY_USER || secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_PATH
          script: |
            set -e
            source ~/.bashrc 2>/dev/null || true
            TARGET_DIR="${DEPLOY_PATH/#\~/$HOME}"
            cd "$TARGET_DIR"
            if [ -f ~/.vultacore_prev_sha ]; then
              git reset --hard "$(cat ~/.vultacore_prev_sha)"
              npm ci --omit=dev --legacy-peer-deps || npm ci --omit=dev || true
              if command -v passenger-config >/dev/null 2>&1; then passenger-config restart-app "$TARGET_DIR" || touch tmp/restart.txt; else touch tmp/restart.txt; fi
              echo "Rolled back to $(git rev-parse --short HEAD)"
            fi
