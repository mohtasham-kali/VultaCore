name: CD — Deploy on Merge to Main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read          # original had contents: write, which nothing needed

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never cancel a deploy halfway

jobs:
  ci-web:
    # Deploy only code that passed frontend CI
    uses: ./.github/workflows/ci-web.yml
    secrets: inherit

  ci-api:
    # Deploy only code that passed backend API CI
    uses: ./.github/workflows/ci-api.yml
    secrets: inherit

  deploy-hostinger:
    name: Deploy to Hostinger
    needs: [ci-web, ci-api]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production     # create it in Settings > Environments; add required reviewers if you want a manual gate
    env:
      # Set these under Settings > Secrets and variables. They were hardcoded
      # in the original, which is public recon info in a public repo.
      #   vars:    DEPLOY_PATH (the REAL app directory), HEALTH_URL
      #   secrets: DEPLOY_HOST, DEPLOY_PORT, DEPLOY_USER, SSH_PRIVATE_KEY, DEPLOY_HOST_FINGERPRINT
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
    steps:
      - name: Deploy over SSH
        id: deploy
        uses: appleboy/ssh-action@v1.0.3   # let Dependabot (github-actions ecosystem) keep this current
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}   # pins the server host key
          envs: DEPLOY_PATH
          script_stop: true      # any failing command aborts the deploy
          script: |
            set -euo pipefail
            source ~/.bashrc 2>/dev/null || source ~/.bash_profile 2>/dev/null || true

            # FIX: original cd'd into "~/domains/://techprogression.com", which is not a real
            # path, and `mkdir -p ... && cd` silently created it. Fail instead of guessing.
            [ -n "${DEPLOY_PATH:-}" ] || { echo "DEPLOY_PATH not set"; exit 1; }
            [ -d "$DEPLOY_PATH/.git" ] || { echo "$DEPLOY_PATH is not a git checkout"; exit 1; }
            cd "$DEPLOY_PATH"

            git config --global --add safe.directory "$DEPLOY_PATH"

            # Remember where we were so we can roll back.
            git rev-parse HEAD > ~/.vultacore_prev_sha

            # saas.sqlite is tracked in git, so `reset --hard` would overwrite the live DB
            # with the committed copy. Back it up and restore it. Remove this block once
            # you `git rm --cached saas.sqlite` and gitignore it.
            if [ -f saas.sqlite ]; then
              mkdir -p ~/backups
              cp saas.sqlite ~/backups/saas.$(date +%Y%m%d-%H%M%S).sqlite
              cp saas.sqlite /tmp/saas.keep
            fi

            echo "=== FETCH ==="
            git fetch origin main
            git reset --hard origin/main
            [ -f /tmp/saas.keep ] && cp /tmp/saas.keep saas.sqlite && rm -f /tmp/saas.keep

            echo "=== NODE DEPS ==="
            npm ci --omit=dev

            echo "=== PYTHON AI SERVICE ==="
            if [ -d ai-services ]; then
              cd ai-services
              PY=""
              for c in /opt/alt/python311/bin/python3 /opt/alt/python310/bin/python3 /opt/alt/python39/bin/python3 python3.11 python3.10 python3.9 python3; do
                if command -v "$c" >/dev/null 2>&1 || [ -x "$c" ]; then PY="$c"; break; fi
              done
              [ -n "$PY" ] || { echo "No Python 3 found"; exit 1; }
              [ -x venv/bin/python ] || "$PY" -m venv venv
              ./venv/bin/pip install --quiet --upgrade pip
              ./venv/bin/pip install --quiet -r requirements.txt
              cd "$DEPLOY_PATH"
            fi

            echo "=== RESTART ==="
            if command -v passenger-config >/dev/null 2>&1; then
              passenger-config restart-app "$DEPLOY_PATH"
            else
              mkdir -p tmp && touch tmp/restart.txt
            fi
            echo "Deployed $(git rev-parse --short HEAD) at $(date -u)"

      # The original always went green. Now the job proves the site is up.
      - name: Health check
        id: health
        run: |
          URL="${{ vars.HEALTH_URL }}"
          [ -n "$URL" ] || { echo "::error::HEALTH_URL not set"; exit 1; }
          for i in 1 2 3 4 5 6; do
            body=$(curl -fsS --max-time 20 "$URL" || true)
            if echo "$body" | jq -e '.status=="up" and .ready.backend and .ready.dashboard and (.uptime < 600)' >/dev/null 2>&1; then
              echo "Healthy and freshly restarted: $body"
              echo "$body" | jq -e '.ready.ai' >/dev/null || echo "::warning::AI service is not ready"
              exit 0
            fi
            echo "Attempt $i not healthy yet: $body"; sleep 10
          done
          echo "::error::Health check failed (down, not ready, or never restarted)"; exit 1

      - name: Roll back on failure
        if: failure() && steps.deploy.outcome == 'success' && steps.health.outcome == 'failure'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          envs: DEPLOY_PATH
          script: |
            set -e
            source ~/.bashrc 2>/dev/null || true
            cd "$DEPLOY_PATH"
            git reset --hard "$(cat ~/.vultacore_prev_sha)"
            npm ci --omit=dev
            if command -v passenger-config >/dev/null 2>&1; then passenger-config restart-app "$DEPLOY_PATH"; else touch tmp/restart.txt; fi
            echo "Rolled back to $(git rev-parse --short HEAD)"