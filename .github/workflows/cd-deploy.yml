name: CD — Deploy on Merge to Main

on:
  push:
    branches: [main]

jobs:
  deploy-hostinger:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-dashboard/package-lock.json

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: web-dashboard/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('web-dashboard/package-lock.json') }}-${{ hashFiles('web-dashboard/src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('web-dashboard/package-lock.json') }}-

      - name: Install & Build Next.js
        working-directory: web-dashboard
        run: |
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: https://vultacore.techprogression.com/api

      - name: Commit built .next back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web-dashboard/.next/
          git diff --staged --quiet || git commit -m "ci: update compiled next.js build [skip ci]"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/mohtasham-kali/VultaCore.git main

      - name: Deploy to Hostinger via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASS }}
          script: |
            cd ~/domains/vultacore.techprogression.com/nodejs
            git fetch origin main
            git reset --hard origin/main

  deploy-api:
    name: Deploy Backend API
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write


    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t vultacore-api:${{ github.sha }} ./backend-api

      - name: Verify API Startup
        run: |
          docker run -d --name test-api -p 3001:3001 vultacore-api:${{ github.sha }}
          sleep 10
          curl -f http://localhost:3001 || (docker logs test-api && exit 1)
          docker rm -f test-api


      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lower case owner name
        run: |
          echo "OWNER_LOWER=${GITHUB_REPOSITORY_OWNER,,}" >> ${GITHUB_ENV}

      - name: Push image
        run: |
          docker tag vultacore-api:${{ github.sha }} ghcr.io/${{ env.OWNER_LOWER }}/vultacore-api:latest
          docker push ghcr.io/${{ env.OWNER_LOWER }}/vultacore-api:latest

  deploy-ai:
    name: Deploy AI Services
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t vultacore-ai:${{ github.sha }} ./ai-services

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lower case owner name
        run: |
          echo "OWNER_LOWER=${GITHUB_REPOSITORY_OWNER,,}" >> ${GITHUB_ENV}

      - name: Push image
        run: |
          docker tag vultacore-ai:${{ github.sha }} ghcr.io/${{ env.OWNER_LOWER }}/vultacore-ai:latest
          docker push ghcr.io/${{ env.OWNER_LOWER }}/vultacore-ai:latest


