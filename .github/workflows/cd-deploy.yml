name: CD — Deploy on Merge to Main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]

jobs:
  deploy-hostinger:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to push .next build back to repo

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Wipe stale .next build from git cache
        run: |
          git rm -r --cached web-dashboard/.next/ 2>/dev/null || true

      - name: Install & Build Next.js
        working-directory: web-dashboard
        run: |
          npm install
          npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: https://vultacore.techprogression.com/api

      - name: Commit built .next back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f web-dashboard/.next/
          git add -f backend-api/dist/ || true
          git diff --staged --quiet || git commit -m "ci: update compiled next.js build [skip ci]"
          git pull --rebase origin main
          git push origin main

      - name: 🔍 Diagnose and Commit Hostinger Logs
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          echo "${{ secrets.HOSTINGER_SSH_PASS }}" > ssh_pass.txt
          chmod 600 ssh_pass.txt
          
          sshpass -f ssh_pass.txt ssh -o StrictHostKeyChecking=no ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }} -p ${{ secrets.HOSTINGER_SSH_PORT }} > diag.txt << 'EOF'
            echo "=== NODE VERSION ==="
            node --version 2>&1 || echo "node not found in PATH"
            echo "=== APP DIR CONTENTS ==="
            ls -la ~/domains/vultacore.techprogression.com/nodejs/ 2>/dev/null || echo "dir missing"
            echo "=== HTTP-PROXY MODULE ==="
            ls ~/domains/vultacore.techprogression.com/nodejs/node_modules/http-proxy 2>/dev/null && echo "FOUND" || echo "MISSING"
            echo "=== HOSTINGER STDERR.LOG (NODE APP CRASH) ==="
            cat ~/domains/vultacore.techprogression.com/nodejs/stderr.log 2>/dev/null || echo "(no stderr.log)"
            echo "=== HOSTINGER SERVER.LOG ==="
            tail -n 100 ~/domains/vultacore.techprogression.com/nodejs/logs/server.log 2>/dev/null || echo "(no server.log)"
            echo "=== STARTUP TEST ==="
            cd ~/domains/vultacore.techprogression.com/nodejs
            timeout 5 node app.js 2>&1 || echo "Test complete or crashed"
          EOF
          
          rm ssh_pass.txt
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diag.txt
          git commit -m "ci: commit diagnostic logs [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main

      - name: Deploy to Hostinger via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASS }}
          script: |
            # 1. Source environment so that node/npm might be in PATH
            source ~/.bashrc 2>/dev/null || source ~/.bash_profile 2>/dev/null || true
            cd ~/domains/vultacore.techprogression.com/nodejs

            # 2. Pull latest code
            git fetch origin main
            git reset --hard origin/main

            # 3. Install root dependencies properly (swallowing errors if npm is missing on SSH)
            npm install --omit=dev 2>&1 | tail -5 || echo "npm install bypassed due to missing path"

            # 4. Set up Python venv for AI service (creates venv if missing, always syncs deps)
            echo "Setting up Python AI service venv..."
            cd ~/domains/vultacore.techprogression.com/nodejs/ai-services
            if [ ! -f "venv/bin/python3" ]; then
              python3 -m venv venv && echo "✅ venv created"
            fi
            venv/bin/pip install --quiet --upgrade pip
            venv/bin/pip install --quiet -r requirements.txt && echo "✅ AI deps installed"
            cd ~/domains/vultacore.techprogression.com/nodejs

            # 5. Restart via Passenger CLI (Hostinger's actual mechanism)
            #    Try multiple methods in order of preference
            if command -v passenger-config &>/dev/null; then
              passenger-config restart-app ~/domains/vultacore.techprogression.com/nodejs && echo "✅ passenger-config restart done"
            elif command -v passenger &>/dev/null; then
              passenger restart-app ~/domains/vultacore.techprogression.com/nodejs && echo "✅ passenger restart done"
            else
              # Fallback: touch the restart file
              mkdir -p tmp && touch tmp/restart.txt && echo "✅ restart.txt touched"
            fi

            echo "Deploy complete at $(date)"


  deploy-api:
    name: Deploy Backend API
    runs-on: ubuntu-latest
    continue-on-error: true  # Don't block the pipeline if Docker build fails
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t vultacore-api:${{ github.sha }} ./backend-api

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lower case owner name
        run: |
          echo "OWNER_LOWER=${GITHUB_REPOSITORY_OWNER,,}" >> ${GITHUB_ENV}

      - name: Push image
        run: |
          docker tag vultacore-api:${{ github.sha }} ghcr.io/${{ env.OWNER_LOWER }}/vultacore-api:latest
          docker push ghcr.io/${{ env.OWNER_LOWER }}/vultacore-api:latest

  deploy-ai:
    name: Deploy AI Services
    runs-on: ubuntu-latest
    continue-on-error: true  # Don't block the pipeline if AI build fails
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t vultacore-ai:${{ github.sha }} ./ai-services

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lower case owner name
        run: |
          echo "OWNER_LOWER=${GITHUB_REPOSITORY_OWNER,,}" >> ${GITHUB_ENV}

      - name: Push image
        run: |
          docker tag vultacore-ai:${{ github.sha }} ghcr.io/${{ env.OWNER_LOWER }}/vultacore-ai:latest
          docker push ghcr.io/${{ env.OWNER_LOWER }}/vultacore-ai:latest
