name: CD — Deploy on Merge to Main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never cancel a deploy halfway

jobs:
  ci-web:
    # Deploy only code that passed frontend CI
    uses: ./.github/workflows/ci-web.yml
    secrets: inherit

  ci-api:
    # Deploy only code that passed backend API CI
    uses: ./.github/workflows/ci-api.yml
    secrets: inherit

  deploy-hostinger:
    name: Deploy to Hostinger
    needs: [ci-web, ci-api]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CURRENT_DIR: ~/domains/vultacore.techprogression.com/hbuilds/current/nodejs
      TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Deploy over SSH
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST || '45.130.228.127' }}
          port: ${{ secrets.DEPLOY_PORT || 65002 }}
          username: ${{ secrets.DEPLOY_USER || 'u879979656' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: CURRENT_DIR,TARGET_SHA
          script_stop: true
          script: |
            set -euo pipefail

            CUR="${CURRENT_DIR/#\~/$HOME}"
            [ -d "$CUR" ] || { echo "ERROR: $CUR (hbuilds/current/nodejs) not found"; exit 1; }

            echo "=== Hostinger Deployment Verification ==="
            echo "Target commit SHA: ${TARGET_SHA:-any}"

            # Wait up to 3.5 minutes for Hostinger's automated hbuilds runner to finish and switch 'current'
            MATCHED=false
            if [ -n "${TARGET_SHA:-}" ]; then
              for i in $(seq 1 42); do
                CURRENT_SHA=$(git -C "$CUR" rev-parse HEAD 2>/dev/null || true)
                if [ "$CURRENT_SHA" = "$TARGET_SHA" ] || [ "${CURRENT_SHA:0:7}" = "${TARGET_SHA:0:7}" ]; then
                  echo "✓ Hostinger hbuilds has deployed target commit: $CURRENT_SHA"
                  MATCHED=true
                  break
                fi
                echo "[$i/42] Waiting for Hostinger hbuilds to deploy $TARGET_SHA (current is ${CURRENT_SHA:-none})..."
                sleep 5
              done
            fi

            if [ "$MATCHED" = false ]; then
              echo "Notice: Hostinger hbuilds current commit differs or still pending; signalling restart."
            fi

            # Record rollback point
            git -C "$CUR" rev-parse HEAD > ~/.vultacore_prev_sha 2>/dev/null || true

            # Ensure Passenger picks up the latest version
            mkdir -p "$CUR/tmp"
            touch "$CUR/tmp/restart.txt"
            echo "Passenger restart signalled at $(date -u)"

      - name: Health check
        id: health
        run: |
          URL="${{ secrets.HEALTH_URL || vars.HEALTH_URL || 'https://vultacore.techprogression.com/health' }}"
          [ -n "$URL" ] || { echo "::error::HEALTH_URL not set"; exit 1; }
          for i in 1 2 3 4 5 6; do
            body=$(curl -fsS --max-time 20 "$URL" || true)
            if echo "$body" | jq -e '.status=="up" and .ready.backend and .ready.dashboard' >/dev/null 2>&1; then
              echo "Healthy and running: $body"
              exit 0
            fi
            echo "Attempt $i not healthy yet: $body"; sleep 10
          done
          echo "::error::Health check failed (down, not ready, or timeout)"; exit 1

      - name: Roll back on failure
        if: failure() && steps.deploy.outcome == 'success' && steps.health.outcome == 'failure'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST || '45.130.228.127' }}
          port: ${{ secrets.DEPLOY_PORT || 65002 }}
          username: ${{ secrets.DEPLOY_USER || 'u879979656' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: CURRENT_DIR
          script: |
            set -e
            CUR="${CURRENT_DIR/#\~/$HOME}"
            if [ -f ~/.vultacore_prev_sha ]; then
              cd "$CUR"
              git reset --hard "$(cat ~/.vultacore_prev_sha)" || true
              touch "$CUR/tmp/restart.txt"
              echo "Rolled back to $(cat ~/.vultacore_prev_sha)"
            fi
