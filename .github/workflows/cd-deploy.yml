name: CD — Deploy on Merge to Main

on:
  push:
    branches: [main]

jobs:
   deploy-hostinger:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install & Build Next.js
        working-directory: web-dashboard
        run: |
          npm install
          npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: https://techprogression.com

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: 🔍 Diagnose Hostinger Logs
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: '45.130.228.127'
          port: 65002
          username: 'u879979656'
          key: ${{ secrets.SSH_PRIVATE_KEY }}  # <--- Added Key here so this step passes
          script: |
            source ~/.bashrc 2>/dev/null || source ~/.bash_profile 2>/dev/null || true
            echo "=== NODE VERSION ==="
            node --version 2>&1 || echo "node not found in PATH"
            echo "=== APP DIR CONTENTS ==="
            ls -la ~/domains/://techprogression.com 2>/dev/null || echo "dir missing"
            echo "=== HTTP-PROXY MODULE ==="
            ls ~/domains/://techprogression.comnode_modules/http-proxy 2>/dev/null && echo "FOUND" || echo "MISSING"
            echo "=== HOSTINGER STDERR.LOG (NODE APP CRASH) ==="
            cat ~/domains/://techprogression.comstderr.log 2>/dev/null || echo "(no stderr.log)"
            echo "=== HOSTINGER SERVER.LOG ==="
            tail -n 100 ~/domains/://techprogression.comlogs/server.log 2>/dev/null || echo "(no server.log)"
            echo "=== STARTUP TEST ==="
            cd ~/domains/://techprogression.com
            timeout 5 node app.js 2>&1 || echo "Test complete or crashed"

      - name: Deploy to Hostinger via SSH
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: '45.130.228.127'
          username: 'u879979656'
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 65002   
          script: |
            set +e
            source ~/.bashrc 2>/dev/null || source ~/.bash_profile 2>/dev/null || true
            
            # Prevent Git dubious ownership errors on shared Hostinger server
            git config --global --add safe.directory "*" 2>/dev/null || true

            cd ~/domains/://techprogression.com || mkdir -p ~/domains/://techprogression.com && cd ~/domains/://techprogression.com

            echo "=== FETCHING LATEST CODE ==="
            git fetch origin main 2>&1 || git fetch --all 2>&1 || echo "Git fetch warning"
            git reset --hard origin/main 2>&1 || echo "Git reset warning"

            echo "=== INSTALLING NODE DEPENDENCIES ==="
            npm install --omit=dev 2>&1 || echo "npm install warning — continuing build"

            echo "=== SETTING UP PYTHON AI SERVICE ==="
            if [ -d "ai-services" ]; then
              cd ai-services
              PYTHON_BIN=""
              for py in /opt/alt/python311/bin/python3 /opt/alt/python310/bin/python3 /opt/alt/python39/bin/python3 python3.11 python3.10 python3.9 python3; do
                if command -v $py &>/dev/null || [ -x "$py" ]; then
                  PYTHON_BIN=$py
                  break
                fi
              done
              
              if [ -n "$PYTHON_BIN" ]; then
                echo "Using Python: $PYTHON_BIN"
                if [ ! -d "venv" ] || [ ! -f "venv/bin/python" ]; then
                  $PYTHON_BIN -m venv venv 2>/dev/null || true
                fi
                if [ -f "venv/bin/pip" ]; then
                  ./venv/bin/pip install --quiet --upgrade pip 2>&1 || true
                  ./venv/bin/pip install --quiet -r requirements.txt 2>&1 && echo "✅ AI deps installed in venv" || echo "AI deps install warning"
                else
                  $PYTHON_BIN -m pip --version &>/dev/null || (curl -sS https://pypa.io | $PYTHON_BIN 2>&1 || true)
                  $PYTHON_BIN -m pip install --quiet --upgrade pip 2>&1 || true
                  $PYTHON_BIN -m pip install --quiet --target ./.python_packages -r requirements.txt 2>&1 && echo "✅ AI deps installed locally in .python_packages" || echo "AI deps install warning"
                fi
              else
                echo "⚠️ Python 3 not found on system"
              fi
              cd ~/domains/://techprogression.com
            fi

            echo "=== RESTARTING PASSENGER / NODE PROCESS ==="
            if command -v passenger-config &>/dev/null; then
              passenger-config restart-app ~/domains/://techprogression.com && echo "✅ passenger-config restart done"
            elif command -v passenger &>/dev/null; then
              passenger restart-app ~/domains/://techprogression.com && echo "✅ passenger restart done"
            else
              mkdir -p tmp && touch tmp/restart.txt && echo "✅ restart.txt touched"
            fi

            echo "Deploy complete at $(date)"
            exit 0
