title = "VultaCore Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist for harmless placeholders, public client tokens, and test fixtures"
paths = [
  '''^\.next/''',
  '''^node_modules/''',
  '''^web-dashboard/\.next/''',
  '''^web-dashboard/\.env\.production$''',
  '''^dist/''',
  '''^out/''',
  '''^package-lock\.json$''',
]
regexes = [
  '''placeholder-anon-key''',
  '''https://placeholder\.supabase\.co''',
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJpc3MiOiJzdXBhYmFzZS''', # Supabase public anon key prefix
  '''test_9e29179d58ce76ae5336e35a234''', # Paddle sandbox client token (browser-public)
  '''live_5bafc73b23c79ca1e42182ec16a''', # Paddle live client token (browser-public)
  '''(?:test|live)_[0-9a-f]{27}''', # Paddle browser-public client token pattern
  '''pdl_ntfset_your_destination_secret_here''',
  '''pdl_sdbx_apikey_your_api_key_here''',
  '''your_paddle_webhook_secret''',
  '''your_supabase_service_role_secret''',
]

[[rules]]
id = "vultacore-lemonsqueezy-api-key"
description = "Lemon Squeezy API Key Detection"
regex = '''(?i)(?:lemonsqueezy|ls)[-_]?(?:api[-_]?key|secret|token)\s*[:=]\s*['"][a-zA-Z0-9_\-\.]{20,}['"]'''
secretGroup = 0
keywords = ["lemonsqueezy", "ls_api_key", "ls_webhook_secret"]

[[rules]]
id = "vultacore-supabase-service-role"
description = "Supabase Service Role Secret Key"
regex = '''(?i)(?:supabase|service)[-_]?(?:role|secret)[-_]?(?:key)?\s*[:=]\s*['"]ey[a-zA-Z0-9_\-\.]{50,}['"]'''
secretGroup = 0
keywords = ["supabase", "service_role", "SUPABASE_SERVICE_KEY"]

