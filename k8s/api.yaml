apiVersion: apps/v1
kind: Deployment
metadata:
  name: vultacore-api
  labels:
    app: vultacore-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vultacore-api
  template:
    metadata:
      labels:
        app: vultacore-api
    spec:
      containers:
      - name: api
        image: ghcr.io/mohtasham-kali/vultacore/vultacore-api:latest
        ports:
        - containerPort: 3001
        env:
        - name: NODE_ENV
          value: "production"
        - name: DATABASE_URL
          value: "/data/saas.sqlite" # Assuming persistent volume
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: vultacore-api
spec:
  selector:
    app: vultacore-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3001
  type: ClusterIP
