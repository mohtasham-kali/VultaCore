apiVersion: apps/v1
kind: Deployment
metadata:
  name: vultacore-api
  labels:
    app: vultacore-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vultacore-api
  template:
    metadata:
      labels:
        app: vultacore-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: api
        image: ghcr.io/mohtasham-kali/vultacore-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3001
          name: http
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3001"
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3001
          initialDelaySeconds: 20
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: vultacore-api
  labels:
    app: vultacore-api
spec:
  type: ClusterIP
  selector:
    app: vultacore-api
  ports:
  - port: 3001
    targetPort: 3001
    name: http

